name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-ml.txt

      - name: Installer les dépendances (torch CPU)
        run: |
          pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ml.txt

      - name: Entraîner le modèle fallback
        run: python -m app.ml.train_model

      - name: Lancer les tests
        # Le modèle Hugging Face n'est pas téléchargé en CI : les tests
        # tournent sur le modèle fallback scikit-learn.
        env:
          HF_HUB_OFFLINE: "1"
        run: pytest -v
